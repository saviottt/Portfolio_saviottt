  </defs>
  <rect width="100" height="100" rx="22" fill="url(#safBg)"/>
  <circle cx="50" cy="50" r="40" fill="url(#oceanBg)"/>
  <circle cx="50" cy="50" r="38" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-dasharray="2,2"/>
  <circle cx="50" cy="50" r="30" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
